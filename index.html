<style>

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  background: #FCFBFF;
  margin: 0;
  padding: 20px;
  color: #5a3e2e;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  background: white;
  border-radius: 28px;
  padding: 20px 24px 32px;
  border: 1px solid #E5DBFF;
  box-shadow: 0 8px 30px rgba(111,82,229,0.06);
}

h2 {
  text-align: center;
  color: #6F52E5;
  margin: 0 0 8px;
  font-size: 28px;
}

.sub {
  text-align: center;
  color: #a16241;
  font-size: 13px;
  border-bottom: 1px solid #f3dec8;
  padding-bottom: 12px;
  margin-bottom: 20px;
}

h3 {
  background: #F4EEFF;
  padding: 10px 12px;
  border-radius: 24px;
  color: #6F52E5;
  margin: 20px 0 12px;
  font-size: 16px;
}

label {
  font-weight: 600;
  color: #5a3e2e;
  display: block;
  margin: 12px 0 4px;
}

input,
select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #D8C9FF;
  border-radius: 20px;
  background: #FFFFFF;
  outline: none;
}

input:focus,
select:focus {
  border-color: #8F6BFF;
}

.product-card {
  background: #fff;
  border-radius: 24px;
  padding: 14px;
  border: 1px solid #ffe3cc;
  margin-bottom: 16px;
}

.product-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}

.product-name {
  font-weight: 700;
  color: #5a3e2e;
  line-height: 1.45;
}

.product-price {
  font-weight: 700;
  color: #b33c1c;
  white-space: nowrap;
}

.stock-display {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  display: inline-block;
  margin: 3px 5px 3px 0;
}

.stock-display.high {
  background: #e8f5e9;
  color: #2e7d32;
}

.stock-display.low {
  background: #fff3e0;
  color: #ef6c00;
}

.stock-display.out {
  background: #ffcdd2;
  color: #b71c1c;
}

.qty-group {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #F8F5FF;
  padding: 6px 10px;
  border-radius: 40px;
  margin-top: 8px;
  width: fit-content;
}

.qty-group button {
  width: 32px;
  height: 32px;
  background: #E7DDFF;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
}

.qty-group button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.qty-group input {
  width: 60px;
  text-align: center;
  padding: 6px;
  border-radius: 30px;
  border: 1px solid #ffd9b5;
}

.moon-section {
  border: 1px solid #eadfff;
  background: #fcfaff;
  border-radius: 24px;
  padding: 14px;
  margin-bottom: 16px;
}

.moon-section-title {
  font-weight: 800;
  color: #6F52E5;
  font-size: 17px;
  margin-bottom: 4px;
}

.moon-section-note {
  font-size: 12px;
  color: #a16241;
  margin-bottom: 12px;
}

.flavor-card {
  background: white;
  border: 1px solid #eee3ff;
  border-radius: 18px;
  padding: 10px;
  margin-bottom: 9px;
}

.flavor-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.flavor-name {
  font-weight: 650;
  line-height: 1.4;
}

.flavor-series {
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 12px;
  background: #F4EEFF;
  color: #6F52E5;
}

.selection-summary {
  background: #F4EEFF;
  color: #6F52E5;
  padding: 10px 12px;
  border-radius: 18px;
  margin-top: 12px;
  font-size: 13px;
  font-weight: 700;
}

.selection-summary.invalid {
  background: #ffebee;
  color: #c62828;
}

.selection-summary.valid {
  background: #e8f5e9;
  color: #2e7d32;
}

.total {
  background: #F8F5FF;
  padding: 16px;
  border-radius: 28px;
  margin: 20px 0;
}

.total-item {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

.total-item:last-child {
  font-size: 18px;
}

button.submit-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg,#8F6BFF,#6D4CFF);
  color: white;
  border: none;
  font-size: 18px;
  font-weight: bold;
  border-radius: 40px;
  cursor: pointer;
}

button.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.refresh-stock {
  float: right;
  font-size: 12px;
  background: #e9ddd0;
  padding: 4px 12px;
  border-radius: 20px;
  cursor: pointer;
}

.error-banner {
  background: #ffebee;
  color: #c62828;
  padding: 10px;
  border-radius: 20px;
  margin-bottom: 20px;
  text-align: center;
  display: none;
}

.warning-banner {
  background: #fff8e1;
  color: #8d6e00;
  padding: 10px 12px;
  border-radius: 18px;
  margin: 10px 0;
  font-size: 12px;
  line-height: 1.5;
}

.required-star {
  color: #9B7DFF;
}

.address-note {
  font-size: 12px;
  color: #a16241;
  margin-top: -4px;
  margin-bottom: 8px;
}

.loading-spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid #fff;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.address-footer {
  text-align: center;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid #eee4dc;
  color: #8a6a58;
  font-size: 12px;
  line-height: 1.7;
}

.address-footer .company {
  font-size: 13px;
  font-weight: 700;
  color: #5a3e2e;
}

.address-footer .phone {
  font-size: 14px;
  font-weight: 700;
  color: #6F52E5;
}

.empty-stock {
  color: #b71c1c;
  font-size: 11px;
}

</style>

// 工具函数
// ============================================================

function getStockClass(stock) {

  if (stock <= 0) {
    return "out";
  }

  if (stock <= 10) {
    return "low";
  }

  return "high";
}


function getStockText(stock) {

  if (stock <= 0) {
    return "❌ 缺货";
  }

  return "📦 库存 " + stock;
}


// ============================================================
// 查询单个库存
// ============================================================

async function getStock(id) {

  try {

    const response =
      await fetch(API_URL + "?id=" + encodeURIComponent(id));

    const data = await response.json();

    if (data.success) {

      return Number(data.stock) || 0;

    }

    return 0;

  } catch (error) {

    document.getElementById("apiError").style.display = "block";

    return 0;

  }

}


// ============================================================
// 加载全部库存
// ============================================================

async function loadAllStocks() {

  document.getElementById("productList").innerHTML =
    "<div style='text-align:center;padding:20px;'>🔄 正在读取库存...</div>";

  try {

    const allIds = products.map(function(p) {
      return p.id;
    });

    const uniqueIds = [...new Set(allIds)];

    for (const id of uniqueIds) {

      stocks[id] = await getStock(id);

    }


    // 7种混搭口味库存

    for (const flavor of mixedFlavors) {

      if (stocks[flavor.id] === undefined) {
        stocks[flavor.id] = await getStock(flavor.id);
      }

    }


    // 蛋黄酥库存

    for (const flavor of eggYolkFlavors) {

      if (stocks[flavor.id] === undefined) {
        stocks[flavor.id] = await getStock(flavor.id);
      }

    }


    document.getElementById("apiError").style.display = "none";

    renderProducts();

    calcTotal();

  } catch (error) {

    document.getElementById("apiError").style.display = "block";

    renderProducts();

  }

}


// ============================================================
// 数量变化
// ============================================================

function changeQty(inputId, delta, maxStock) {

  const input = document.getElementById(inputId);

  if (!input || input.disabled) {
    return;
  }

  let value = parseInt(input.value) || 0;

  value += delta;

  if (value < 0) {
    value = 0;
  }

  if (value > maxStock) {
    value = maxStock;
  }

  input.value = value;

  calcTotal();

}


// ============================================================
// 普通商品数量变化
// ============================================================

function changeNormalQty(id, delta) {

  const input =
    document.getElementById("qty_" + id);

  if (!input || input.disabled) {
    return;
  }

  const stock =
    Number(stocks[id]) || 0;

  changeQty(
    "qty_" + id,
    delta,
    stock
  );

}


// ============================================================
// 混搭口味数量变化
// ============================================================

function changeMixedFlavor(id, delta) {

  const stock =
    Number(stocks[id]) || 0;

  let value =
    Number(mixedFlavorQty[id]) || 0;

  value += delta;

  if (value < 0) {
    value = 0;
  }

  if (value > stock) {
    value = stock;
  }

  mixedFlavorQty[id] = value;

  renderProducts();

  calcTotal();

}


// ============================================================
// 蛋黄酥数量变化
// ============================================================

function changeEggYolk(id, delta) {

  const stock =
    Number(stocks[id]) || 0;

  let value =
    Number(eggYolkQty[id]) || 0;

  value += delta;

  if (value < 0) {
    value = 0;
  }

  if (value > stock) {
    value = stock;
  }

  eggYolkQty[id] = value;

  renderProducts();

  calcTotal();

}


// ============================================================
// 直接输入普通商品数量
// ============================================================

function normalInputChange(id) {

  const input =
    document.getElementById("qty_" + id);

  if (!input) {
    return;
  }

  let value =
    parseInt(input.value) || 0;

  const stock =
    Number(stocks[id]) || 0;

  if (value < 0) {
    value = 0;
  }

  if (value > stock) {
    value = stock;
  }

  input.value = value;

  calcTotal();

}


// ============================================================
// 取得普通商品数量
// ============================================================

function getNormalQty(id) {

  const input =
    document.getElementById("qty_" + id);

  if (!input) {
    return 0;
  }

  return parseInt(input.value) || 0;

}


// ============================================================
// 烤皮 + 酥皮总粒数
// ============================================================

function getMixedTotalQty() {

  let total = 0;

  mixedFlavors.forEach(function(flavor) {

    total += Number(mixedFlavorQty[flavor.id]) || 0;

  });

  return total;

}


// ============================================================
// 蛋黄酥总粒数
// ============================================================

function getEggYolkTotalQty() {

  let total = 0;

  eggYolkFlavors.forEach(function(flavor) {

    total += Number(eggYolkQty[flavor.id]) || 0;

  });

  return total;

}


// ============================================================
// 是否有选择冰皮
// ============================================================

function hasSnowSkinSelected() {

  for (const p of products) {

    if (
      p.type === "snowSkin" ||
      p.type === "snowSkinDurian"
    ) {

      const qty =
        getNormalQty(p.id);

      if (qty > 0) {
        return true;
      }

    }

  }

  return false;

}


// ============================================================
// 更新冰皮邮寄限制
// ============================================================

function updateSnowSkinRestriction() {

  const delivery =
    document.getElementById("delivery");

  const warning =
    document.getElementById("snowSkinWarning");

  if (hasSnowSkinSelected()) {

    delivery.value = "自取";

    delivery.querySelector(
      'option[value="邮寄"]'
    ).disabled = true;

    warning.style.display = "block";

  } else {

    delivery.querySelector(
      'option[value="邮寄"]'
    ).disabled = false;

    warning.style.display = "none";

  }

}


// ============================================================
// 计算礼盒数量
// ============================================================
//
// 普通商品：每一个商品选择单位算1盒/件
//
// 烤皮+酥皮：4粒 = 1盒
//
// 蛋黄酥：6粒 = 1盒
//
// 其他固定月饼：每选1个 = 1盒
//
// 第一盒 RM10
// 后续每盒 RM3
// ============================================================

function calculateShippingBoxes() {

  let boxes = 0;


  // ----------------------------------------------------------
  // 普通商品
  // ----------------------------------------------------------

  products.forEach(function(p) {

    if (
      p.type === "normal" ||
      p.type === "moonFixed"
    ) {

      const qty =
        getNormalQty(p.id);

      boxes += qty;

    }

  });


  // ----------------------------------------------------------
  // 冰皮
  // ----------------------------------------------------------

  products.forEach(function(p) {

    if (
      p.type === "snowSkin" ||
      p.type === "snowSkinDurian"
    ) {

      const qty =
        getNormalQty(p.id);

      boxes += qty;

    }

  });


  // ----------------------------------------------------------
  // 烤皮 + 酥皮
  // ----------------------------------------------------------

  const mixedQty =
    getMixedTotalQty();

  if (mixedQty > 0) {

    boxes += Math.ceil(mixedQty / 4);

  }


  // ----------------------------------------------------------
  // 蛋黄酥
  // ----------------------------------------------------------

  const eggQty =
    getEggYolkTotalQty();

  if (eggQty > 0) {

    boxes += Math.ceil(eggQty / 6);

  }


  return boxes;

}


// ============================================================
// 运费
// ============================================================

function calculateShippingFee() {

  const delivery =
    document.getElementById("delivery").value;

  if (delivery !== "邮寄") {
    return 0;
  }


  const boxes =
    calculateShippingBoxes();


  if (boxes <= 0) {
    return 0;
  }


  // 第一盒 RM10
  // 后续每盒 RM3

  return 10 + Math.max(0, boxes - 1) * 3;

}


// ============================================================
// 商品价格计算
// ============================================================

function calculateProductTotal() {

  let total = 0;


  // ----------------------------------------------------------
  // 普通商品 / 固定商品
  // ----------------------------------------------------------

  products.forEach(function(p) {

    if (
      p.type === "normal" ||
      p.type === "moonFixed" ||
      p.type === "snowSkin" ||
      p.type === "snowSkinDurian"
    ) {

      const qty =
        getNormalQty(p.id);

      total += qty * Number(p.price);

    }

  });


  // ----------------------------------------------------------
  // 烤皮 + 酥皮
  //
  // 4粒 = RM69.90
  // ----------------------------------------------------------

  const mixedQty =
    getMixedTotalQty();

  if (mixedQty > 0) {

    total +=
      Math.ceil(mixedQty / 4) * 69.90;

  }


  // ----------------------------------------------------------
  // 蛋黄酥
  //
  // 6粒 = RM79.90
  // ----------------------------------------------------------

  const eggQty =
    getEggYolkTotalQty();

  if (eggQty > 0) {

    total +=
      Math.ceil(eggQty / 6) * 79.90;

  }


  return total;

}

// ============================================================

function calcTotal() {

  updateSnowSkinRestriction();


  // ----------------------------------------------------------
  // 商品总价
  // ----------------------------------------------------------

  const productTotal =
    calculateProductTotal();


  // ----------------------------------------------------------
  // 运费
  // ----------------------------------------------------------

  const shippingFee =
    calculateShippingFee();


  // ----------------------------------------------------------
  // 总计
  // ----------------------------------------------------------

  const grandTotal =
    productTotal + shippingFee;


  document.getElementById("productTotal").innerText =
    productTotal.toFixed(2);

  document.getElementById("shipping").innerText =
    shippingFee.toFixed(2);

  document.getElementById("total").innerText =
    grandTotal.toFixed(2);


  // 更新礼盒选择提示

  updateEggYolkSummary();

// ============================================================

// ============================================================

function renderNormalProduct(p) {

  const stock =
    Number(stocks[p.id]) || 0;

  const disabled =
    stock <= 0 ? "disabled" : "";

  return `

// ============================================================
// 取得订单商品
// ============================================================
//
// 这里最重要：
//
// 烤皮/酥皮不是以一个ID扣库存。
// 而是7个口味分别提交。
// 
// 例如：
// 201 ×2
// 204 ×1
// 207 ×1
//
// Apps Script 就会分别扣库存。
// ============================================================

function buildOrderProducts() {

  const orderProducts = [];


  // ----------------------------------------------------------
  // 普通 / 固定商品
  // ----------------------------------------------------------

  products.forEach(function(p) {

    if (
      p.type === "normal" ||
      p.type === "moonFixed" ||
      p.type === "snowSkin" ||
      p.type === "snowSkinDurian"
    ) {

      const qty =
        getNormalQty(p.id);

      if (qty > 0) {

        orderProducts.push({

          id: p.id,

          name: p.name + " " + p.spec,

          qty: qty,

          price: p.price,

          type: p.type,

          series: p.series || ""

        });

      }

    }

  });


  // ----------------------------------------------------------
  // 烤皮 + 酥皮
  // ----------------------------------------------------------

  mixedFlavors.forEach(function(flavor) {

    const qty =
      Number(mixedFlavorQty[flavor.id]) || 0;

    if (qty > 0) {

      orderProducts.push({

        id: flavor.id,

        name:
          "中秋礼盒 " +
          flavor.series +
          " " +
          flavor.name +
          " " +
          flavor.en,

        qty: qty,

        price: 0,

        type: "mixedFlavor",

        series: flavor.series

      });

    }

  });


  // ----------------------------------------------------------
  // 蛋黄酥
  // ----------------------------------------------------------

  eggYolkFlavors.forEach(function(flavor) {

    const qty =
      Number(eggYolkQty[flavor.id]) || 0;

    if (qty > 0) {

      orderProducts.push({

        id: flavor.id,

        name:
          flavor.name +
          " " +
          flavor.en,

        qty: qty,

        price: 0,

        type: "eggYolkPastry",

        series: "蛋黄酥"

      });

    }

  });


  return orderProducts;

}


// ============================================================
// 验证订单
// ============================================================

function validateOrder() {


  // ----------------------------------------------------------
  // 基本资料
  // ----------------------------------------------------------

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();


  if (!name || !phone || !address) {

    alert("请填写完整客户资料");

    return false;

  }


  if (!/^\d{9,11}$/.test(phone)) {

    alert("手机号格式错误，请输入9至11位数字");

    return false;

  }


  // ----------------------------------------------------------
  // 付款截图
  // ----------------------------------------------------------

  const file =
    document.getElementById("payment").files[0];

  if (!file) {

    alert("请上传付款截图");

    return false;

  }


  // ----------------------------------------------------------
  // 烤皮 + 酥皮必须4粒
  // ----------------------------------------------------------

  const mixedQty =
    getMixedTotalQty();

  if (
    mixedQty !== 0 &&
    mixedQty !== 4
  ) {

    alert(
      "烤皮系列 & 酥皮系列礼盒必须刚好选择4粒。\n\n" +
      "目前选择：" +
      mixedQty +
      "粒"
    );

    return false;

  }


  // ----------------------------------------------------------
  // 蛋黄酥必须6粒
  // ----------------------------------------------------------

  const eggQty =
    getEggYolkTotalQty();

  if (
    eggQty !== 0 &&
    eggQty !== 6
  ) {

    alert(
      "蛋黄酥礼盒必须刚好选择6粒。\n\n" +
      "目前选择：" +
      eggQty +
      "粒"
    );

    return false;

  }


  // ----------------------------------------------------------
  // 冰皮禁止邮寄
  // ----------------------------------------------------------

  if (
    hasSnowSkinSelected() &&
    document.getElementById("delivery").value === "邮寄"
  ) {

    alert(
      "冰皮月饼禁止邮寄，只限自取。"
    );

    return false;

  }


  // ----------------------------------------------------------
  // 至少一个商品
  // ----------------------------------------------------------

  const orderProducts =
    buildOrderProducts();

  if (orderProducts.length === 0) {

    alert("请选择商品");

    return false;

  }


  return true;

}
  <script>

// ============================================================
// 提交订单
// ============================================================

async function submitOrder() {


  // ----------------------------------------------------------
  // 验证
  // ----------------------------------------------------------

  if (!validateOrder()) {
    return;
  }


  // ----------------------------------------------------------
  // 资料
  // ----------------------------------------------------------

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const delivery =
    document.getElementById("delivery").value;

  const remark =
    document.getElementById("remark").value.trim();


  // ----------------------------------------------------------
  // 商品
  // ----------------------------------------------------------

  const orderProducts =
    buildOrderProducts();


  // ----------------------------------------------------------
  // 金额
  // ----------------------------------------------------------

  const productTotal =
    calculateProductTotal();

  const shippingFee =
    calculateShippingFee();

  const total =
    productTotal + shippingFee;


  // ----------------------------------------------------------
  // 按钮
  // ----------------------------------------------------------

  const btn =
    document.getElementById("submitBtn");

  btn.disabled = true;

  btn.innerHTML =
    '<span class="loading-spinner"></span> 提交中...';


  // ----------------------------------------------------------
  // 图片
  // ----------------------------------------------------------

  const file =
    document.getElementById("payment").files[0];


  const reader =
    new FileReader();


  reader.onload = async function(event) {

    try {


      // ------------------------------------------------------
      // Payload
      // ------------------------------------------------------

      const payload = {

        name: name,

        phone: phone,

        address: address,

        delivery: delivery,

        remark: remark,

        products: orderProducts,

        productTotal:
          productTotal.toFixed(2),

        shippingFee:
          shippingFee.toFixed(2),

        total:
          total.toFixed(2),

        paymentImage:
          event.target.result

      };


      // ------------------------------------------------------
      // POST
      // ------------------------------------------------------

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",
            body: JSON.stringify(payload)
          }
        );


      const data =
        await response.json();


      // ------------------------------------------------------
      // 成功
      // ------------------------------------------------------

      if (data.status === "success") {


        document.body.innerHTML = `

          <div style="
            max-width:600px;
            margin:50px auto;
            text-align:center;
            background:white;
            border-radius:28px;
            padding:32px;
            border:1px solid #E5DBFF;
            box-shadow:0 8px 30px rgba(111,82,229,0.08);
          ">

            <h2 style="
              color:#6F52E5;
              margin-bottom:20px;
            ">
              🎉 下单成功！
            </h2>


            <p style="
              font-size:15px;
              color:#5a3e2e;
            ">
              感谢您的订单
            </p >


            <p style="
              font-size:16px;
              color:#5a3e2e;
            ">
              订单号：
              <strong>
                ${data.orderId}
              </strong>
            </p >


            <p style="
              color:#8a6a58;
              font-size:13px;
              line-height:1.6;
            ">
              我们会尽快确认您的订单及付款。
            </p >


            <button
              onclick="location.reload()"
              style="
                margin-top:20px;
                padding:12px 24px;
                background:#6F52E5;
                color:white;
                border:none;
                border-radius:20px;
                font-size:15px;
                cursor:pointer;
              "
            >
              继续下单
            </button>

          </div>

        `;


      } else {


        alert(
          "提交失败：" +
          (data.message || "未知错误")
        );


        btn.disabled = false;

        btn.innerHTML =
          "📦 提交订单";

      }


    } catch(error) {


      alert(
        "网络错误：" +
        error.message
      );


      btn.disabled = false;

      btn.innerHTML =
        "📦 提交订单";


    }

  };


  reader.onerror = function() {

    alert("付款截图读取失败，请重新上传");

    btn.disabled = false;

    btn.innerHTML =
      "📦 提交订单";

  };


  reader.readAsDataURL(file);

}
