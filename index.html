<title>福满家订单系统</title>

<style>

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  background: #FCFBFF;
  margin: 0;
  padding: 20px;
  color: #5a3e2e;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  background: white;
  border-radius: 28px;
  padding: 20px 24px 32px;
  border: 1px solid #E5DBFF;
  box-shadow: 0 8px 30px rgba(111,82,229,0.06);
}

h2 {
  text-align: center;
  color: #6F52E5;
  margin: 0 0 8px;
}

.sub {
  text-align: center;
  color: #a16241;
  font-size: 13px;
  border-bottom: 1px solid #f3dec8;
  padding-bottom: 12px;
  margin-bottom: 20px;
}

h3 {
  background: #F4EEFF;
  padding: 10px 12px;
  border-radius: 24px;
  color: #6F52E5;
  margin: 20px 0 12px;
}

label {
  font-weight: 600;
  color: #5a3e2e;
  display: block;
  margin: 12px 0 4px;
}

input,
select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #D8C9FF;
  border-radius: 20px;
  background: #FFFFFF;
  outline: none;
}

input:focus,
select:focus {
  border-color: #9B7DFF;
}

.product-card {
  background: #fff;
  border-radius: 24px;
  padding: 14px;
  border: 1px solid #ffe3cc;
  margin-bottom: 16px;
}

.product-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.product-name {
  font-weight: 700;
  color: #5a3e2e;
}

.product-price {
  color: #8c5b38;
  font-size: 14px;
  font-weight: 700;
}

.stock-display {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  display: inline-block;
  margin-right: 6px;
  margin-bottom: 6px;
}

.stock-display.high {
  background: #e8f5e9;
  color: #2e7d32;
}

.stock-display.low {
  background: #fff3e0;
  color: #ef6c00;
}

.stock-display.out {
  background: #ffcdd2;
  color: #b71c1c;
}

.qty-group {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #F8F5FF;
  padding: 6px 12px;
  border-radius: 40px;
  margin-top: 8px;
  width: fit-content;
}

.qty-group button,
.flavor-qty button {
  width: 32px;
  height: 32px;
  background: #E7DDFF;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
}

.qty-group button:disabled,
.flavor-qty button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.qty-group input {
  width: 62px;
  text-align: center;
  padding: 6px;
  border-radius: 30px;
  border: 1px solid #ffd9b5;
}

.total {
  background: #F8F5FF;
  padding: 16px;
  border-radius: 28px;
  margin: 20px 0;
}

.total-item {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

button.submit-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg,#8F6BFF,#6D4CFF);
  color: white;
  border: none;
  font-size: 18px;
  font-weight: bold;
  border-radius: 40px;
  cursor: pointer;
}

button.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.refresh-stock {
  float: right;
  font-size: 12px;
  background: #e9ddd0;
  padding: 4px 12px;
  border-radius: 20px;
  cursor: pointer;
}

.error-banner {
  background: #ffebee;
  color: #c62828;
  padding: 10px;
  border-radius: 20px;
  margin-bottom: 20px;
  text-align: center;
  display: none;
}

.required-star {
  color: #9B7DFF;
}

.address-note {
  font-size: 12px;
  color: #a16241;
  margin-top: -4px;
  margin-bottom: 8px;
}

.notice {
  background: #fff8ef;
  border: 1px solid #f5dcc0;
  color: #8b5e3c;
  padding: 10px 12px;
  border-radius: 16px;
  font-size: 12px;
  line-height: 1.7;
  margin-bottom: 12px;
}

.warning-notice {
  background: #fff0f0;
  border: 1px solid #ffcaca;
  color: #c62828;
}

.mooncake-image {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 20px;
  margin-bottom: 12px;
  display: none;
}

.mooncake-image.has-image {
  display: block;
}

.mooncake-title {
  font-size: 17px;
  font-weight: 800;
  color: #6F52E5;
  margin-bottom: 3px;
}

.mooncake-en {
  font-size: 11px;
  color: #9b7d70;
  margin-bottom: 12px;
}

.flavor-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.flavor-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 16px;
  background: #FBF9FF;
}

.flavor-name {
  font-size: 13px;
  line-height: 1.5;
}

.flavor-name small {
  color: #9b7d70;
}

.flavor-qty {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.flavor-qty input {
  width: 52px;
  padding: 6px;
  text-align: center;
  border-radius: 20px;
}

.box-counter {
  text-align: center;
  margin-top: 14px;
  padding: 10px;
  background: #F4EEFF;
  color: #6F52E5;
  border-radius: 18px;
  font-size: 13px;
}

.flavor-warning {
  display: none;
  background: #fff0f0;
  color: #c62828;
  padding: 9px;
  border-radius: 15px;
  margin-top: 10px;
  text-align: center;
  font-size: 12px;
}

.box-quantity {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #decfff;
}

.box-quantity-label {
  font-size: 12px;
  font-weight: 700;
  color: #6F52E5;
}

.success-box {
  max-width: 600px;
  margin: 50px auto;
  text-align: center;
  background: white;
  border-radius: 28px;
  padding: 32px;
  border: 1px solid #E5DBFF;
}

.company-footer {
  max-width: 700px;
  margin: 30px auto 10px;
  text-align: center;
  color: #8a7568;
  font-size: 11px;
  line-height: 1.7;
  padding: 18px 10px 5px;
}

.company-footer .company-name {
  font-weight: 700;
  font-size: 13px;
  color: #6f52e5;
  margin-bottom: 3px;
}

.company-footer .phone {
  margin-top: 5px;
  font-weight: 600;
}

.loading-spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid #fff;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 520px) {

  body {
    padding: 10px;
  }

  .container {
    padding: 16px;
    border-radius: 22px;
  }

  .product-header {
    display: block;
  }

  .product-price {
    display: block;
    margin-top: 5px;
  }

  .flavor-row {
    align-items: flex-start;
  }

}

</style>

// ========================

let stocks = {};


// ========================
// 获取库存
// ========================

async function getStock(id) {

  try {

    const response =
      await fetch(
        API_URL + "?id=" + id
      );

    const data =
      await response.json();

    if (data.success) {

      return Number(data.stock) || 0;

    }

    return 0;

  }

  catch (error) {

    document.getElementById(
      "apiError"
    ).style.display = "block";

    return 0;

  }

}


// ========================
// 加载全部库存
// ========================

async function loadAllStocks() {

  const allIds = [

    ...products.map(
      p => p.id
    ),

    ...mooncakeProducts.map(
      p => p.id
    )

  ];


  for (const id of allIds) {

    stocks[id] =
      await getStock(id);

  }


  renderProducts();

  renderMooncakes();

  calcTotal();

}


// ========================
// 库存显示样式
// ========================

function stockClass(stock) {

  if (stock <= 0) {

    return "out";

  }

  if (stock <= 10) {

    return "low";

  }

  return "high";

}


// ========================
// 库存显示文字
// ========================

function stockText(stock) {

  if (stock <= 0) {

    return "❌ 缺货";

  }

  return "📊 库存 " + stock;

}


// ========================
// 获取库存
// ========================

function getStockValue(id) {

  return Number(
    stocks[id] || 0
  );

}

// 数量按钮

// ========================

function changeQty(

  inputId,

  delta,

  maxStock

) {

  const input =

    document.getElementById(

      inputId

    );

  if (

    !input ||

    input.disabled

  ) {

    return;

  }

  let current =

    parseInt(

      input.value

    ) || 0;

  let newValue =

    current + delta;

  if (newValue < 0) {

    newValue = 0;

  }

  if (newValue > maxStock) {

    newValue = maxStock;

  }

  input.value =

    newValue;

  calcTotal();

}

// ========================

// 手动输入数量检查

// ========================

function validateInputQty(

  inputId,

  maxStock

) {

  const input =

    document.getElementById(

      inputId

    );

  if (!input) {

    return;

  }

  let value =

    parseInt(

      input.value

    );

  if (isNaN(value)) {

    value = 0;

  }

  if (value < 0) {

    value = 0;

  }

  if (value > maxStock) {

    value = maxStock;

  }

  input.value =

    value;

  calcTotal();

}

// ========================

// 混搭口味数量

// ========================

function changeFlavorQty(

  id,

  delta,

  maxStock

) {

  const input =

    document.getElementById(

      "flavor_" + id

    );

  if (

    !input ||

    input.disabled

  ) {

    return;

  }

  let value =

    parseInt(

      input.value

    ) || 0;

  value += delta;

  if (value < 0) {

    value = 0;

  }

  if (value > maxStock) {

    value = maxStock;

  }

  input.value =

    value;

  updateMixedCounter();

  calcTotal();

}

  id,

) {

  const input =

      "flavor_" + id

    );

  if (!input) {

    return;

  }

  let value =

    parseInt(

      input.value

    );

  if (isNaN(value)) {

    value = 0;

  }

  if (value < 0) {

    value = 0;

  }

  if (value > maxStock) {

    value = maxStock;

  }

  input.value =

    value;

  updateMixedCounter();

  calcTotal();

}

// ========================

// 混搭总粒数

// ========================

function getMixedTotal() {

  let total = 0;

  for (

    const flavor of mixedFlavors

  ) {

    const input =

      document.getElementById(

        "flavor_" + flavor.id

      );

    if (input) {

      total +=

        parseInt(

          input.value

        ) || 0;

    }

  }

  return total;

}

// ========================

// 混搭礼盒数量

// ========================

function getMixedBoxQty() {

  const input =

    document.getElementById(

      "mixedBoxQty"

    );

  if (!input) {

    return 0;

  }

  let qty =

    parseInt(

      input.value

    ) || 0;

  if (qty < 1) {

    qty = 1;

  }

  return qty;

}

// ========================

// 更新混搭显示

// ========================

function updateMixedCounter() {

  const total =

    getMixedTotal();

  const display =

    document.getElementById(

      "mixedSelected"

    );

  const warning =

    document.getElementById(

      "mixedWarning"

    );

  if (display) {

    display.innerText =

      total;

  }

  if (warning) {

    if (total === 4) {

      warning.style.display =

        "none";

    } else {

      warning.style.display =

        "block";

    }

  }

}
