      html +=

        renderEggYolkPastry();

      // ==========================================================

      // 冰皮榴莲

      // ID 32

      // ==========================================================

      const musangKing =

        products.find(

          function(product) {

            return (

              product.id === 32

            );

          }

        );

      if (musangKing) {

        html += `

          <div

            class="section-title"

          >

            冰皮榴莲

          </div>

          <div

            class="shipping-warning"

          >

            ⚠️ 冰皮月饼禁止邮寄，只限自取

          </div>

        `;

        html +=

          renderNormalProduct(

            musangKing

          );

      }

      // ==========================================================

      // 福满四季

      // ID 33

      // ==========================================================

      const fuManSeason =

        products.find(

          function(product) {

            return (

              product.id === 33

            );

          }

        );

      if (fuManSeason) {

        html += `

          <div

            class="section-title"

          >

            福满四季

          </div>

        `;

        html +=

          renderNormalProduct(

            fuManSeason

          );

      }

      container.innerHTML =

        html;

    }

    // ============================================================

    // 判断是否有冰皮商品

    // ============================================================

    function hasSnowSkinProduct() {

      const snowSkinIds = [

        25,

        26,

        27,

        28,

        32

      ];

      return snowSkinIds.some(

        function(id) {

          return (

            Number(

              quantities[id]

            ) > 0

          );

        }

      );

    }

    // ============================================================

    // 获取所有选择的商品总数量

    //

    // 用于计算：

    // 第一件 RM10

    // 后续每件 RM3

    // ============================================================

    function getTotalShippingItemCount() {

      let count = 0;

      // 普通商品

      products.forEach(

        function(product) {

          const quantity =

            Number(

              quantities[

                product.id

              ]

            ) || 0;

          if (

            quantity > 0

          ) {

            count +=

              quantity;

          }

        }

      );

      // 烤皮礼盒

      // 只要选择刚好4粒

      // 算1盒

      if (

        getBakedSelectedCount() === 4

      ) {

        count += 1;

      }

      // 酥皮礼盒

      // 只要选择刚好4粒

      // 算1盒

      if (

        getFlakySelectedCount() === 4

      ) {

        count += 1;

      }

      return count;

    }

// ============================================================

    // 计算商品总价

    // ============================================================

    function calculateProductTotal() {

      let total = 0;

      // ==========================================================

      // 所有普通商品

      // ==========================================================

      products.forEach(

        function(product) {

          const quantity =

            Number(

              quantities[

                product.id

              ]

            ) || 0;

          if (

            quantity > 0

          ) {

            total +=

              Number(

                product.price

              ) *

              quantity;

          }

        }

      );

      // ==========================================================

      // 烤皮系列礼盒

      // 只有刚好4粒才算RM69.90

      // ==========================================================

      if (

        getBakedSelectedCount() === 4

      ) {

        total +=

          69.90;

      }

      // ==========================================================

      // 酥皮系列礼盒

      // 只有刚好4粒才算RM69.90

      // ==========================================================

      if (

        getFlakySelectedCount() === 4

      ) {

        total +=

          69.90;

      }

      return total;

    }

    // ============================================================

    // 计算邮费

    //

    // 第一样商品 RM10

    // 后续每一样商品 RM3

    //

    // 礼盒以1盒计算

    // ============================================================

    function calculateShippingFee() {

      const delivery =

        document.getElementById(

          "delivery"

        );

      // 自取免费

      if (

        delivery &&

        delivery.value === "pickup"

      ) {

        return 0;

      }

      const itemCount =

        getTotalShippingItemCount();

      if (

        itemCount <= 0

      ) {

        return 0;

      }

      return (

        10 +

        (

          (itemCount - 1) *

          3

        )

      );

    }

    // ============================================================

    // 计算总金额

    //

    // 每次增加或取消商品都会重新计算

    // 邮费会正确增加或减少

    // ============================================================

    function calcTotal() {

      const productTotal =

        calculateProductTotal();

      const shippingFee =

        calculateShippingFee();

      const total =

        productTotal +

        shippingFee;

      const productTotalElement =

        document.getElementById(

          "productTotal"

        );

      const shippingElement =

        document.getElementById(

          "shippingFee"

        );

      const totalElement =

        document.getElementById(

          "totalAmount"

        );

      if (

        productTotalElement

      ) {

        productTotalElement.textContent =

          `RM${productTotal.toFixed(2)}`;

      }

      if (

        shippingElement

      ) {

        shippingElement.textContent =

          `RM${shippingFee.toFixed(2)}`;

      }

      if (

        totalElement

      ) {

        totalElement.textContent =

          `RM${total.toFixed(2)}`;

      }

      return {

        productTotal:

          productTotal,

        shippingFee:

          shippingFee,

        total:

          total

      };

    }

    // ============================================================

    // 配送方式改变

    // ============================================================

    function changeDelivery() {

      const delivery =

        document.getElementById(

          "delivery"

        );

      if (

        !delivery

      ) {

        return;

      }

      // 如果有冰皮

      // 不能选择邮寄

      if (

        hasSnowSkinProduct() &&

        delivery.value === "shipping"

      ) {

        alert(

          "冰皮月饼禁止邮寄，只限自取"

        );

        delivery.value =

          "pickup";

      }

      calcTotal();

    }
    // ============================================================

    // 获取烤皮礼盒选择的口味

    // ============================================================

    function getBakedSelectedFlavors() {

      const selected = [];

      mixedFlavors.forEach(

        function(flavor) {

          const quantity =

            Number(

              bakedFlavorQty[

                flavor.id

              ]

            ) || 0;

          if (

            quantity > 0

          ) {

            selected.push({

              id: flavor.id,

              name:

                `${flavor.name} ${flavor.en}`,

              qty:

                quantity

            });

          }

        }

      );

      return selected;

    }

    // ============================================================

    // 获取酥皮礼盒选择的口味

    // ============================================================

    function getFlakySelectedFlavors() {

      const selected = [];

      mixedFlavors.forEach(

        function(flavor) {

          const quantity =

            Number(

              flakyFlavorQty[

                flavor.id

              ]

            ) || 0;

          if (

            quantity > 0

          ) {

            selected.push({

              id: flavor.id,

              name:

                `${flavor.name} ${flavor.en}`,

              qty:

                quantity

            });

          }

        }

      );

      return selected;

    }

    // ============================================================

    // 验证烤皮 / 酥皮礼盒

    //

    // 只要有选择，就必须刚好4粒

    // ============================================================

    function validateMixedBoxes() {

      const bakedCount =

        getBakedSelectedCount();

      const flakyCount =

        getFlakySelectedCount();

      if (

        bakedCount > 0 &&

        bakedCount !== 4

      ) {

        alert(

          `烤皮系列礼盒必须刚好选择4粒，目前选择了${bakedCount}粒`

        );

        return false;

      }

      if (

        flakyCount > 0 &&

        flakyCount !== 4

      ) {

        alert(

          `酥皮系列礼盒必须刚好选择4粒，目前选择了${flakyCount}粒`

        );

        return false;

      }

      return true;

    }

    // ============================================================

    // 验证冰皮配送方式

    // ============================================================

    function validateSnowSkinDelivery() {

      if (

        !hasSnowSkinProduct()

      ) {

        return true;

      }

      const delivery =

        document.getElementById(

          "delivery"

        );

      if (

        !delivery ||

        delivery.value !== "pickup"

      ) {

        alert(

          "冰皮月饼禁止邮寄，只限自取。"

        );

        return false;

      }

      return true;

    }

    // ============================================================

    // 检查是否至少选择一种商品

    // ============================================================

    function hasAnyProductSelected() {

      // 普通商品

      const normalSelected =

        products.some(

          function(product) {

            return (

              Number(

                quantities[

                  product.id

                ]

              ) > 0

            );

          }

        );

      // 烤皮礼盒

      const bakedSelected =

        getBakedSelectedCount() > 0;

      // 酥皮礼盒

      const flakySelected =

        getFlakySelectedCount() > 0;

      return (

        normalSelected ||

        bakedSelected ||

        flakySelected

      );

    }

    // ============================================================

    // 整理订单商品

    //

    // 注意：

    // 烤皮 / 酥皮礼盒不是一个独立库存ID

    // 必须按照顾客选择的每一个口味，

    // 分别传给Google Apps Script扣库存

    // ============================================================

    function buildOrderProducts() {

      const orderProducts = [];

      // ==========================================================

      // 普通商品

      // ==========================================================

      products.forEach(

        function(product) {

          const quantity =

            Number(

              quantities[

                product.id

              ]

            ) || 0;

          if (

            quantity > 0

          ) {

            // ----------------------------------------------------

            // 蛋黄酥 ID 110

            //

            // 蛋黄酥礼盒本身不在Inventory扣库存

            // 实际扣减：

            // 29、30、31

            // 每种口味各2粒

            // ----------------------------------------------------

            if (

              product.id === 110

            ) {

              eggYolkFixedFlavors.forEach(

                function(flavor) {

                  orderProducts.push({

                    id:

                      flavor.id,

                    name:

                      `${flavor.name} ${flavor.en}（蛋黄酥固定礼盒）`,

                    qty:

                      quantity * 2,

                    price:

                      0

                  });

                }

              );

              return;

            }

            // ----------------------------------------------------

            // 其他普通商品

            // ----------------------------------------------------

            orderProducts.push({

              id:

                product.id,

              name:

                product.name,

              qty:

                quantity,

              price:

                product.price

            });

          }

        }

      );

      // ==========================================================

      // 烤皮系列礼盒

      //

      // 选择的4粒分别扣对应库存

      // ==========================================================

      if (

        getBakedSelectedCount() === 4

      ) {

        const bakedFlavors =

          getBakedSelectedFlavors();

        bakedFlavors.forEach(

          function(flavor) {

            orderProducts.push({

              id:

                flavor.id,

              name:

                `【烤皮系列礼盒】${flavor.name}`,

              qty:

                flavor.qty,

              price:

                0

            });

          }

        );

      }

      // ==========================================================

      // 酥皮系列礼盒

      //

      // 选择的4粒分别扣对应库存

      // ==========================================================

      if (

        getFlakySelectedCount() === 4

      ) {

        const flakyFlavors =

          getFlakySelectedFlavors();

        flakyFlavors.forEach(

          function(flavor) {

            orderProducts.push({

              id:

                flavor.id,

              name:

                `【酥皮系列礼盒】${flavor.name}`,

              qty:

                flavor.qty,

              price:

                0

            });

          }

        );

      }

      return orderProducts;

    }

    // ============================================================

    // 整理订单显示内容

    //

    // 用于Google Sheet订单记录

    // ============================================================

    function buildItemsText() {

      const items = [];

      // ==========================================================

      // 普通商品

      // ==========================================================

      products.forEach(

        function(product) {

          const quantity =

            Number(

              quantities[

                product.id

              ]

            ) || 0;

          if (

            quantity > 0

          ) {

            // 蛋黄酥特别显示

            if (

              product.id === 110

            ) {

              items.push(

                `蛋黄酥 Egg Yolk Pastry RM79.90 / 6pcs × ${quantity}`

              );

              items.push(

                `固定内容：白莲肉干肉松 Lotus Dried Meat Pork Floss × ${quantity * 2}`

              );

              items.push(

                `固定内容：翡翠肉松麻薯 Pandan Pork Floss Mochi × ${quantity * 2}`

              );

              items.push(

                `固定内容：养生黑芝麻 Black Sesame × ${quantity * 2}`

              );

            } else {

              items.push(

                `${product.name} × ${quantity}`

              );

            }

          }

        }

      );

      // ==========================================================

      // 烤皮礼盒

      // ==========================================================

      if (

        getBakedSelectedCount() === 4

      ) {

        const flavorText =

          getBakedSelectedFlavors()

            .map(

              function(flavor) {

                return (

                  `${flavor.name} × ${flavor.qty}`

                );

              }

            )

            .join(

              "，"

            );

        items.push(

          `烤皮系列礼盒 Traditional Mooncake RM69.90 / 4pcs：${flavorText}`

        );

      }

      // ==========================================================

      // 酥皮礼盒

      // ==========================================================

      if (

        getFlakySelectedCount() === 4

      ) {

        const flavorText =

          getFlakySelectedFlavors()

            .map(

              function(flavor) {

                return (

                  `${flavor.name} × ${flavor.qty}`

                );

              }

            )

            .join(

              "，"

            );

        items.push(

          `酥皮系列礼盒 Flaky Pastry Mooncake RM69.90 / 4pcs：${flavorText}`

        );

      }

      return items.join(

        "\n"

      );

    }

    // ============================================================

    // 读取付款截图

    // ============================================================

    function readPaymentImage() {

      return new Promise(

        function(

          resolve,

          reject

        ) {

          const input =

            document.getElementById(

              "paymentImage"

            );

          if (

            !input ||

            !input.files ||

            input.files.length === 0

          ) {

            resolve(

              ""

            );

            return;

          }

          const file =

            input.files[0];

          const reader =

            new FileReader();

          reader.onload =

            function(event) {

              resolve(

                event.target.result

              );

            };

          reader.onerror =

            function() {

              reject(

                new Error(

                  "付款截图读取失败"

                )

              );

            };

          reader.readAsDataURL(

            file

          );

        }

      );

    }

    // ============================================================

    // 提交订单

    // ============================================================

    async function submitOrder() {

      // ==========================================================

      // 检查商品

      // ==========================================================

      if (

        !hasAnyProductSelected()

      ) {

        alert(

          "请选择至少一种商品"

        );

        return;

      }

      // ==========================================================

      // 检查烤皮 / 酥皮礼盒

      // ==========================================================

      if (

        !validateMixedBoxes()

      ) {

        return;

      }

      // ==========================================================

      // 检查冰皮配送方式

      // ==========================================================

      if (

        !validateSnowSkinDelivery()

      ) {

        return;

      }

      // ==========================================================

      // 读取顾客资料

      //

      // 如果你的第1段input ID是不同名称，

      // 这里必须与第1段保持一致

      // ==========================================================

      const name =

        (

          document.getElementById(

            "name"

          )?.value || ""

        ).trim();

      const phone =

        (

          document.getElementById(

            "phone"

          )?.value || ""

        ).trim();

      const address =

        (

          document.getElementById(

            "address"

          )?.value || ""

        ).trim();

      const delivery =

        document.getElementById(

          "delivery"

        )?.value || "";

      const remark =

        (

          document.getElementById(

            "remark"

          )?.value || ""

        ).trim();

      // ==========================================================

      // 验证资料

      // ==========================================================

      if (

        !name

      ) {

        alert(

          "请输入姓名"

        );

        return;

      }

      if (

        !phone

      ) {

        alert(

          "请输入联络号码"

        );

        return;

      }

      if (

        !delivery

      ) {

        alert(

          "请选择配送方式"

        );

        return;

      }

      // 邮寄时必须填写地址

      if (

        delivery === "shipping" &&

        !address

      ) {

        alert(

          "请输入邮寄地址"

        );

        return;

      }

      // 自取没有填写地址时

      // 自动记录自取地址

      let finalAddress =

        address;

      if (

        delivery === "pickup" &&

        !finalAddress

      ) {

        finalAddress =

          "9, Jalan Perdangangan 1, Taman Universiti, 81300, Skudai, Johor.";

      }

      // ==========================================================

      // 再次计算金额

      // ==========================================================

      const totals =

        calcTotal();

      // ==========================================================

      // 整理库存扣减商品

      // ==========================================================

      const stockProducts =

        buildOrderProducts();

      // ==========================================================

      // 检查付款截图

      // ==========================================================

      let paymentImage =

        "";

      try {

        paymentImage =

          await readPaymentImage();

      } catch (

        error

      ) {

        console.error(

          error

        );

      }

      // ==========================================================

      // 提交按钮

      // ==========================================================

      const submitButton =

        document.getElementById(

          "submitBtn"

        );

      const originalButtonText =

        submitButton

          ? submitButton.textContent

          : "";

      if (

        submitButton

      ) {

        submitButton.disabled =

          true;

        submitButton.textContent =

          "订单提交中...";

      }

      // ==========================================================

      // 建立提交数据

      // ==========================================================

      const orderData = {

        name:

          name,

        phone:

          phone,

        address:

          finalAddress,

        delivery:

          delivery,

        products:

          stockProducts,

        itemsText:

          buildItemsText(),

        productTotal:

          totals.productTotal,

        shippingFee:

          totals.shippingFee,

        total:

          totals.total,

        paymentImage:

          paymentImage,

        remark:

          remark

      };

      try {

        // ========================================================

        // 提交至Google Apps Script

        // ========================================================

        const response =

          await fetch(

            API_URL,

            {

              method:

                "POST",

              headers:

                {

                  "Content-Type":

                    "text/plain;charset=utf-8"

                },

              body:

                JSON.stringify(

                  orderData

                )

            }

          );

        const result =

          await response.json();

        // ========================================================

        // 成功

        // ========================================================

        if (

          result.status ===

          "success"

        ) {

          alert(

            `订单提交成功！\n订单编号：${result.orderId}`

          );

          resetOrder();

          return;

        }

        // ========================================================

        // Google Apps Script返回错误

        // ========================================================

        alert(

          result.message ||

          "订单提交失败，请稍后再试"

        );

      } catch (

        error

      ) {

        console.error(

          error

        );

        alert(

          "订单提交失败，请检查网络或系统设置后再试"

        );

      } finally {

        if (

          submitButton

        ) {

          submitButton.disabled =

            false;

          submitButton.textContent =

            originalButtonText ||

            "提交订单";

        }

      }

    }

    // ============================================================

    // 重置订单

    // ============================================================

    function resetOrder() {

      // 普通商品

      products.forEach(

        function(product) {

          quantities[

            product.id

          ] = 0;

        }

      );

      // 烤皮礼盒口味

      mixedFlavors.forEach(

        function(flavor) {

          bakedFlavorQty[

            flavor.id

          ] = 0;

        }

      );

      // 酥皮礼盒口味

      mixedFlavors.forEach(

        function(flavor) {

          flakyFlavorQty[

            flavor.id

          ] = 0;

        }

      );

      // 顾客资料

      const nameInput =

        document.getElementById(

          "name"

        );

      const phoneInput =

        document.getElementById(

          "phone"

        );

      const addressInput =

        document.getElementById(

          "address"

        );

      const remarkInput =

        document.getElementById(

          "remark"

        );

      const paymentInput =

        document.getElementById(

          "paymentImage"

        );

      if (nameInput) {

        nameInput.value = "";

      }

      if (phoneInput) {

        phoneInput.value = "";

      }

      if (addressInput) {

        addressInput.value = "";

      }

      if (remarkInput) {

        remarkInput.value = "";

      }

      if (paymentInput) {

        paymentInput.value = "";

      }

      renderProducts();

      calcTotal();

    }

    // ============================================================

    // 页面初始化

    // ============================================================

    document.addEventListener(

      "DOMContentLoaded",

      function() {

        // --------------------------------------------------------

        // 配送方式监听

        // --------------------------------------------------------

        const delivery =

          document.getElementById(

            "delivery"

          );

        if (

          delivery

        ) {

          delivery.addEventListener(

            "change",

            changeDelivery

          );

        }

        // --------------------------------------------------------

        // 提交按钮监听

        // --------------------------------------------------------

        const submitButton =

          document.getElementById(

            "submitBtn"

          );

        if (

          submitButton

        ) {

          submitButton.addEventListener(

            "click",

            function(event) {

              event.preventDefault();

              submitOrder();

            }

          );

        }

        // --------------------------------------------------------

        // 加载库存和商品

        // --------------------------------------------------------

        loadAllStocks();

      }

    );

    // ============================================================

    // 供HTML直接onclick调用

    // ============================================================

    window.changeQty =

      changeQty;

    window.updateQtyFromInput =

      updateQtyFromInput;

    window.changeBakedFlavorQty =

      changeBakedFlavorQty;

    window.changeFlakyFlavorQty =

      changeFlakyFlavorQty;

    window.changeEggYolkBoxQty =

      changeEggYolkBoxQty;

    window.changeDelivery =

      changeDelivery;

    window.submitOrder =

      submitOrder;

</script>
